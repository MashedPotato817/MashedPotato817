<svg xmlns="http://www.w3.org/2000/svg" width="900" height="190" viewBox="0 0 900 190" role="img" aria-labelledby="title description">
  <title id="title">MashedPotato817</title>
  <desc id="description">蓝绿信号从终端依次传向芯片和 Web，播放两轮后停止。左上角是土豆标记。</desc>
  <defs>
    <linearGradient id="surface" x2="1" y2="1"><stop stop-color="#101e32"/><stop offset="1" stop-color="#0d2929"/></linearGradient>
    <linearGradient id="accent" gradientUnits="userSpaceOnUse" x1="580" x2="850"><stop stop-color="#60a5fa"/><stop offset="1" stop-color="#2dd4bf"/></linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r="1" fill="#31516b"/></pattern>
    <clipPath id="frame"><rect x="1" y="1" width="898" height="188" rx="18"/></clipPath>
  </defs>
  <style>
    .signal { stroke-dasharray: 12 100; opacity: 0; animation-duration: 6s; animation-timing-function: linear; animation-iteration-count: 2; }
    .to-chip { animation-name: to-chip; }
    .to-web { animation-name: to-web; }
    .node { opacity: 0.15; animation-duration: 6s; animation-iteration-count: 2; }
    .node-terminal { animation-name: terminal; }
    .node-chip { animation-name: chip; }
    .node-web { animation-name: web; }
    @keyframes to-chip { 0%, 10% { stroke-dashoffset: 112; opacity: 0; } 12% { opacity: 1; } 40% { stroke-dashoffset: 0; opacity: 1; } 42%, 100% { stroke-dashoffset: 0; opacity: 0; } }
    @keyframes to-web { 0%, 50% { stroke-dashoffset: 112; opacity: 0; } 52% { opacity: 1; } 80% { stroke-dashoffset: 0; opacity: 1; } 82%, 100% { stroke-dashoffset: 0; opacity: 0; } }
    @keyframes terminal { 0%, 30%, 100% { opacity: 0.15; } 5%, 15% { opacity: 0.9; } }
    @keyframes chip { 0%, 30%, 70%, 100% { opacity: 0.15; } 40%, 50% { opacity: 0.9; } }
    @keyframes web { 0%, 65%, 100% { opacity: 0.15; } 75%, 85% { opacity: 0.9; } }
    @media (prefers-reduced-motion: reduce) { .signal, .node { animation: none; } }
  </style>
  <g clip-path="url(#frame)">
    <rect width="900" height="190" fill="url(#surface)"/>
    <rect x="546" width="354" height="190" fill="url(#grid)" opacity="0.6"/>
    <circle cx="715" cy="96" r="124" fill="none" stroke="#234746"/>
    <g transform="translate(40 23)" fill="none" stroke="#2dd4bf" stroke-width="1.7" stroke-linecap="round">
      <path d="M7 2 C14-2 23 2 24 9 C26 17 17 23 9 22 C1 22-3 14 1 8 Z"/>
      <path d="M7 8 h.1 M17 6 h.1 M18 16 h.1 M6 16 h.1"/>
    </g>
    <g font-family="Segoe UI, Arial, sans-serif">
      <text x="38" y="101" fill="#e6edf3" font-size="48" font-weight="700" letter-spacing="-1.5">MashedPotato817</text>
      <text x="40" y="137" fill="#9eb8cd" font-size="18" letter-spacing="1.2">AI TOOLS / EMBEDDED / WEB</text>
    </g>
    <path d="M40 161 H500" stroke="#2c5057"/>
    <path d="M40 161 H112" stroke="#2dd4bf" stroke-width="3" stroke-linecap="round"/>
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M626 95 H676 M744 95 H794" stroke="#31576b" stroke-width="2"/>
      <g stroke="url(#accent)" stroke-width="3">
        <path class="signal to-chip" pathLength="100" d="M626 95 H676"/>
        <path class="signal to-web" pathLength="100" d="M744 95 H794"/>
      </g>
      <g id="terminal">
        <rect class="node node-terminal" x="565" y="63" width="64" height="64" rx="18" stroke="#60a5fa" stroke-width="2"/>
        <rect x="568" y="66" width="58" height="58" rx="15" fill="#142638" stroke="#35516e"/>
        <path d="m584 85 9 10-9 10 m15 0 h11" stroke="#60a5fa" stroke-width="2.5"/>
      </g>
      <g id="chip">
        <rect class="node node-chip" x="673" y="58" width="74" height="74" rx="21" stroke="#2dd4bf" stroke-width="2"/>
        <rect x="676" y="61" width="68" height="68" rx="18" fill="#142638" stroke="#32645f"/>
        <g stroke="#2dd4bf" stroke-width="2">
          <rect x="696" y="81" width="28" height="28" rx="4"/>
          <path d="M704 75 V81 M716 75 V81 M704 109 V115 M716 109 V115 M690 89 H696 M690 101 H696 M724 89 H730 M724 101 H730"/>
          <rect x="705" y="90" width="10" height="10" rx="1.5"/>
        </g>
      </g>
      <g id="web">
        <rect class="node node-web" x="791" y="63" width="64" height="64" rx="18" stroke="#60a5fa" stroke-width="2"/>
        <rect x="794" y="66" width="58" height="58" rx="15" fill="#142638" stroke="#35516e"/>
        <g stroke="#60a5fa" stroke-width="2">
          <rect x="808" y="81" width="30" height="28" rx="4"/>
          <path d="M808 90 H838 M814 85 H815 M820 85 H821 m-2 11-4 4 4 4 m8-8 4 4-4 4"/>
        </g>
      </g>
    </g>
  </g>
  <rect x="1" y="1" width="898" height="188" rx="18" fill="none" stroke="#294454"/>
</svg>
